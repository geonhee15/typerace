<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>typerace</title>
<style>
  :root{
    --bg1:#1b1140; --bg2:#3a1a6e; --accent:#ffd23f; --accent2:#ff5d8f;
    --good:#37e6a4; --bad:#ff5b6e; --dim:#7a6fb0; --panel:rgba(255,255,255,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    background:radial-gradient(1200px 700px at 70% -10%,#5a2da3 0%,transparent 60%),
               linear-gradient(160deg,var(--bg1),var(--bg2));
    color:#fff; min-height:100vh; display:flex; align-items:center; justify-content:center;
    overflow-x:hidden;
  }
  .wrap{width:min(920px,94vw); padding:24px 0}
  .logo{
    text-align:center; font-weight:900; letter-spacing:-1px; line-height:1;
    font-size:clamp(46px,9vw,96px);
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 6px 30px rgba(255,93,143,.25); user-select:none;
  }
  .logo span{color:#fff;-webkit-text-fill-color:#fff}
  .tag{text-align:center;color:var(--dim);margin-top:8px;font-size:15px;letter-spacing:3px;text-transform:uppercase}

  /* ---- menu ---- */
  .card{
    margin-top:34px; background:var(--panel); border:1px solid rgba(255,255,255,.10);
    border-radius:22px; padding:34px; backdrop-filter:blur(8px);
    box-shadow:0 30px 60px rgba(0,0,0,.35);
  }
  .label{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:14px;text-align:center}
  .levels{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .lvl{
    cursor:pointer;border:2px solid rgba(255,255,255,.12);border-radius:16px;
    padding:20px 12px;text-align:center;transition:.15s;background:rgba(255,255,255,.03)
  }
  .lvl:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.3)}
  .lvl.sel{border-color:var(--accent);background:rgba(255,210,63,.14);box-shadow:0 0 0 3px rgba(255,210,63,.18)}
  .lvl .name{font-size:22px;font-weight:800;text-transform:capitalize}
  .lvl .meta{margin-top:6px;font-size:12px;color:var(--dim)}
  .lvl .best{margin-top:8px;font-size:12px;font-weight:800;color:var(--accent)}
  .lvl .emoji{font-size:26px}
  .start{
    margin-top:26px;width:100%;border:0;cursor:pointer;border-radius:16px;padding:18px;
    font-size:22px;font-weight:900;letter-spacing:1px;color:#2a0e4e;
    background:linear-gradient(90deg,var(--accent),#ffb13f);
    box-shadow:0 12px 30px rgba(255,178,63,.35);transition:.15s
  }
  .start:hover{transform:translateY(-2px);filter:brightness(1.05)}
  .start:active{transform:translateY(0)}

  /* ---- game ---- */
  .hud{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
  .timer-wrap{flex:1}
  .timer-num{font-size:40px;font-weight:900;line-height:1}
  .timer-num small{font-size:16px;color:var(--dim);font-weight:700}
  .bar{height:10px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:10px}
  .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--good),var(--accent));transition:width .15s linear}
  .stats{display:flex;gap:10px}
  .stat{
    background:var(--panel);border:1px solid rgba(255,255,255,.1);border-radius:14px;
    padding:10px 16px;text-align:center;min-width:84px
  }
  .stat b{display:block;font-size:26px;font-weight:900;line-height:1}
  .stat span{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim)}
  .stat.level b{color:var(--accent)}
  .stat.wpm b{color:var(--good)}
  .stat.acc b{color:var(--accent2)}

  .typebox{
    background:var(--panel);border:1px solid rgba(255,255,255,.1);border-radius:20px;
    padding:34px 30px;font-size:clamp(22px,3.4vw,30px);line-height:1.7;font-weight:600;
    letter-spacing:.3px;min-height:160px;position:relative;
    font-family:"Consolas","SF Mono",ui-monospace,monospace;
    white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word;
  }
  .typebox .ch{color:var(--dim);transition:color .05s}
  .typebox .ch.done{color:#fff}
  .typebox .ch.wrong{color:var(--bad);background:rgba(255,91,110,.22);border-radius:3px}
  .typebox .ch.cur{position:relative}
  .typebox .ch.cur::before{
    content:"";position:absolute;left:-2px;top:8%;height:84%;width:3px;border-radius:2px;
    background:var(--accent);animation:blink 1s step-end infinite
  }
  @keyframes blink{50%{opacity:0}}
  .hidinput{position:absolute;opacity:0;left:-9999px}
  .hint{text-align:center;margin-top:16px;color:var(--dim);font-size:13px;letter-spacing:1px}

  /* ---- over ---- */
  .over h2{text-align:center;font-size:40px;font-weight:900;margin-bottom:6px}
  .over .sub{text-align:center;color:var(--dim);margin-bottom:10px}
  .record{text-align:center;font-weight:800;color:var(--accent);margin-bottom:24px;letter-spacing:1px}
  .record.new{color:var(--good);animation:pop .4s ease}
  @keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  .results{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px}
  .res{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:22px 10px;text-align:center}
  .res b{display:block;font-size:38px;font-weight:900}
  .res span{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim)}
  .btnrow{display:flex;gap:12px}
  .btn2{flex:1;cursor:pointer;border-radius:14px;padding:15px;font-size:17px;font-weight:800;border:2px solid rgba(255,255,255,.18);background:transparent;color:#fff;transition:.15s}
  .btn2:hover{border-color:#fff}
  .btn2.primary{border:0;color:#2a0e4e;background:linear-gradient(90deg,var(--accent),#ffb13f)}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">type<span>race</span></div>
  <div class="tag">how far can you go</div>

  <!-- MENU -->
  <div id="menu" class="card">
    <div class="label">select difficulty</div>
    <div class="levels">
      <div class="lvl sel" data-lvl="easy"><div class="emoji">&#128640;</div><div class="name">easy</div><div class="meta">30s &middot; short</div><div class="best" id="bestEasy">&#9733; best 0</div></div>
      <div class="lvl" data-lvl="normal"><div class="emoji">&#9889;</div><div class="name">normal</div><div class="meta">25s &middot; medium</div><div class="best" id="bestNormal">&#9733; best 0</div></div>
      <div class="lvl" data-lvl="hard"><div class="emoji">&#128293;</div><div class="name">hard</div><div class="meta">20s &middot; long</div><div class="best" id="bestHard">&#9733; best 0</div></div>
    </div>
    <button class="start" id="startBtn">START</button>
  </div>

  <!-- GAME -->
  <div id="game" class="card hidden">
    <div class="hud">
      <div class="timer-wrap">
        <div class="timer-num"><span id="tnum">30</span><small>s</small></div>
        <div class="bar"><i id="tbar"></i></div>
      </div>
      <div class="stats">
        <div class="stat level"><b id="sLevel">1</b><span>level</span></div>
        <div class="stat wpm"><b id="sWpm">0</b><span>wpm</span></div>
        <div class="stat acc"><b id="sAcc">100</b><span>accuracy</span></div>
      </div>
    </div>
    <div class="typebox" id="typebox"></div>
    <input class="hidinput" id="hid" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="hint">just start typing &middot; press esc to quit</div>
  </div>

  <!-- GAME OVER -->
  <div id="over" class="card over hidden">
    <h2 id="overTitle">time&rsquo;s up</h2>
    <div class="sub" id="overSub">nice run</div>
    <div class="record" id="recordLine">best 0 levels</div>
    <div class="results">
      <div class="res"><b id="rLevel">0</b><span>levels cleared</span></div>
      <div class="res"><b id="rWpm">0</b><span>avg wpm</span></div>
      <div class="res"><b id="rAcc">0</b><span>accuracy</span></div>
    </div>
    <div class="btnrow">
      <button class="btn2" id="menuBtn">change level</button>
      <button class="btn2 primary" id="againBtn">play again</button>
    </div>
  </div>
</div>

const CONFIG = { easy:{time:30}, normal:{time:25}, hard:{time:20} };

let level = "easy";
let timeLeft, timer, running=false;
let sentences=[], idx=0, target="", typed="";
let correctKeys=0, totalKeys=0, startTime=0, levelStartTime=0, levelsCleared=0;

const $ = id => document.getElementById(id);

// ---- best records (localStorage) ----
const BEST_KEY = "typerace_best";
function loadBest(){
  try{ return JSON.parse(localStorage.getItem(BEST_KEY)) || {easy:0,normal:0,hard:0}; }
  catch(e){ return {easy:0,normal:0,hard:0}; }
}
function saveBest(b){ try{ localStorage.setItem(BEST_KEY, JSON.stringify(b)); }catch(e){} }
let best = loadBest();
function renderBest(){
  $("bestEasy").innerHTML   = "★ best " + (best.easy||0);
  $("bestNormal").innerHTML = "★ best " + (best.normal||0);
  $("bestHard").innerHTML   = "★ best " + (best.hard||0);
}
renderBest();

// menu selection
document.querySelectorAll(".lvl").forEach(el=>{
  el.addEventListener("click",()=>{
    document.querySelectorAll(".lvl").forEach(x=>x.classList.remove("sel"));
    el.classList.add("sel");
    level = el.dataset.lvl;
  });
});

$("startBtn").onclick = startGame;
$("againBtn").onclick = startGame;
$("menuBtn").onclick = ()=>{ show("menu"); };

function show(which){
  ["menu","game","over"].forEach(s=> $(s).classList.toggle("hidden", s!==which));
}

function shuffle(a){
  const arr=a.slice();
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}

function startGame(){
  sentences = shuffle(POOL[level]);
  idx=0; typed=""; correctKeys=0; totalKeys=0; levelsCleared=0;
  timeLeft = CONFIG[level].time;
  running=true; startTime=Date.now(); levelStartTime=Date.now();
  show("game");
  loadSentence();
  updateStats();
  $("tnum").textContent = timeLeft;
  $("tbar").style.width = "100%";
  $("hid").value="";
  $("hid").focus();
  clearInterval(timer);
  timer=setInterval(tick,100);
}

function tick(){
  const elapsed = (Date.now()-levelStartTime)/1000;
  timeLeft = Math.max(0, CONFIG[level].time - elapsed);
  $("tnum").textContent = Math.ceil(timeLeft);
  $("tbar").style.width = (timeLeft/CONFIG[level].time*100)+"%";
  updateStats();
  if(timeLeft<=0) endGame();
}

function loadSentence(){
  target = sentences[idx % sentences.length];
  typed="";
  render();
}

function render(){
  const box=$("typebox");
  let html="";
  for(let i=0;i<target.length;i++){
    let cls="ch";
    if(i<typed.length){ cls += typed[i]===target[i] ? " done" : " wrong"; }
    else if(i===typed.length){ cls += " cur"; }
    html += `<span class="${cls}">${escapeHtml(target[i])}</span>`;
  }
  box.innerHTML=html;
}
function escapeHtml(c){return c.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

$("hid").addEventListener("paste", e=> e.preventDefault());
$("hid").addEventListener("input", e=>{
  if(!running) return;
  const val = e.target.value;
  // count new keystrokes
  if(val.length > typed.length){
    for(let i=typed.length;i<val.length;i++){
      totalKeys++;
      if(val[i]===target[i]) correctKeys++;
    }
  }
  typed = val;
  render();
  updateStats();
  if(typed === target){
    levelsCleared++;
    idx++;
    $("hid").value="";
    typed="";
    loadSentence();
    // reset the countdown timer for the next sentence
    levelStartTime=Date.now();
    timeLeft=CONFIG[level].time;
    $("tnum").textContent=Math.ceil(timeLeft);
    $("tbar").style.width="100%";
    updateStats();
  }
});

document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && running){ endGame(); }
});

// keep focus while playing
$("typebox").addEventListener("click", ()=> $("hid").focus());

function updateStats(){
  const elapsedMin = Math.max((Date.now()-startTime)/60000, 1/60);
  const wpm = Math.round((correctKeys/5)/elapsedMin);
  const acc = totalKeys? Math.round(correctKeys/totalKeys*100):100;
  $("sLevel").textContent = levelsCleared+1;
  $("sWpm").textContent = isFinite(wpm)?wpm:0;
  $("sAcc").textContent = acc;
}

function endGame(){
  running=false;
  clearInterval(timer);
  const elapsedMin = Math.max((Date.now()-startTime)/60000, 1/60);
  const wpm = Math.round((correctKeys/5)/elapsedMin);
  const acc = totalKeys? Math.round(correctKeys/totalKeys*100):100;
  $("rLevel").textContent = levelsCleared;
  $("rWpm").textContent = isFinite(wpm)?wpm:0;
  $("rAcc").textContent = acc;
  let msg = levelsCleared===0 ? "keep practicing" :
            levelsCleared<5 ? "good start" :
            levelsCleared<10 ? "nice run" :
            levelsCleared<16 ? "you are fast" : "blazing fast";
  $("overSub").textContent = msg + " on " + level;

  // best record handling
  const prevBest = best[level] || 0;
  const recEl = $("recordLine");
  if(levelsCleared > prevBest){
    best[level] = levelsCleared;
    saveBest(best);
    renderBest();
    $("overTitle").innerHTML = "new record &#127881;";
    recEl.textContent = "new best on " + level + " : " + levelsCleared + " levels";
    recEl.classList.add("new");
  }else{
    $("overTitle").innerHTML = "time&rsquo;s up";
    recEl.textContent = "best on " + level + " : " + prevBest + " levels";
    recEl.classList.remove("new");
  }
  show("over");
}
</script>
